spring:
  datasource:
    url: jdbc:mysql://生产数据库IP:3306/smart_device?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&useUnicode=true
    username: ${DB_USERNAME}      # 从环境变量读，不写死
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      password: ${REDIS_PASSWORD}
      database: 0

mqtt:
  runtime:
    host: ${MQTT_HOST}
    port: 8883
    client-id: wm-laohua-server-prod
    username: ${MQTT_USERNAME}
    password: ${MQTT_PASSWORD}
  provision:
    host: ${MQTT_HOST}
    port: 8884
    client-id: wm-laohua-provision-prod
    username: ${MQTT_PROVISION_USERNAME}
    password: ${MQTT_PROVISION_PASSWORD}
    ca-cert: certs/cert.pem
firmware:
  upload-dir: /data/firmware/
  base-url: https://ota.yourdomain.com/firmware/

logging:
  level:
    com.womi: info
    com.womi.business.mapper: info
  file:
    name: /var/log/womi/webmodule.log